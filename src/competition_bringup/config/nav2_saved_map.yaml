# Saved-map Nav2 configuration for the unchanged competition robot.
# Initial validation speeds are limited to the Phase 4C demonstrated range.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.3
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 1.5
    max_beams: 60
    min_particles: 300
    max_particles: 800
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.2
    z_short: 0.0
    z_max: 0.0
    update_min_a: 0.05
    # Short Nav2 goals may finish inside the 0.08 m goal tolerance after
    # ~0.05 m travel; update before that without sampling every scan.
    update_min_d: 0.02
    resample_interval: 1
    # A separate one-shot service call supplies bounded start covariance.
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.05
      use_astar: true
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    failure_tolerance: 0.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.04
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.22
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 2.0
      allow_reversing: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.025
      cost_scaling_dist: 0.15
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      transform_tolerance: 0.3

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    max_rotational_vel: 0.25
    min_rotational_vel: 0.05
    rotational_acc_lim: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.20,-0.1675],[-0.20,0.1675],[0.20,0.15],[0.2375,0.13],[0.3075,0.13],[0.3075,-0.13],[0.2375,-0.13],[0.20,-0.15]]"
      footprint_padding: 0.02
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan cubes
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0
        cubes:
          topic: /nav2/cube_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.5
          obstacle_max_range: 8.0
          max_obstacle_height: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.18
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      resolution: 0.05
      footprint: "[[-0.20,-0.1675],[-0.20,0.1675],[0.20,0.15],[0.2375,0.13],[0.3075,0.13],[0.3075,-0.13],[0.2375,-0.13],[0.20,-0.15]]"
      footprint_padding: 0.02
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan cubes
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
          max_obstacle_height: 2.0
        cubes:
          topic: /nav2/cube_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.5
          obstacle_max_range: 8.0
          max_obstacle_height: 0.3
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.18
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
